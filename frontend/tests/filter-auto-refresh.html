<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筛选自动刷新回归测试</title>
  <style>
    html, body { height: auto !important; min-width: 0 !important; overflow: auto !important; }
    body { padding: 16px; }
    h1 { font-size: 18px; }
    #results { font: 13px/1.6 monospace; white-space: pre-wrap; }
    #fixture { width: min(1400px, 100%); }
  </style>
</head>
<body>
  <h1>筛选自动刷新回归测试</h1>
  <pre id="results" role="status">正在运行…</pre>
  <div id="fixture"></div>
  <script type="module">
    // Start Vite and open /tests/filter-auto-refresh.html. No backend required.
    import { createApp, h, nextTick, reactive } from 'vue'
    import FilterBar from '/src/components/FilterBar.vue'
    import { FILTER_OPTION_CACHE_KEY, readFilterOptions } from '/src/filterOptions.ts'
    import '/src/styles.css'

    const fixture = document.querySelector('#fixture')
    const output = document.querySelector('#results')
    const defaults = { keyword: '', city: '', operator: '', tou: '', priceBand: '', piles: '', availability: '', sort: 'idleDesc', page: 1, pageSize: 25 }
    const filters = reactive({ ...defaults, page: 3 })
    const facets = reactive({
      city: { total: 306, counts: { 郑州市: 206, 洛阳市: 100, ...Object.fromEntries(Array.from({ length: 9 }, (_, i) => [`测试城市${i}`, 9-i])), __unknown__: 0 } },
      operator: { total: 206, counts: { 测试运营商: 10, __unknown__: 5 } },
      availability: { total: 206, counts: { idle: 100, moderate: 50, full: 30, unknown: 26 } },
      priceBand: { total: 206, counts: { cheap: 100, mid: 80, expensive: 26, missing: 0 } },
      tou: { total: 206, counts: { has: 150, flat: 50, none: 6 } },
      piles: { total: 206, counts: { with: 180, without: 26 } },
    })
    const originalCache = sessionStorage.getItem(FILTER_OPTION_CACHE_KEY)
    sessionStorage.removeItem(FILTER_OPTION_CACHE_KEY)
    const state = reactive({ loading: true, facets: null })
    const updates = []
    let resetCount = 0
    let refreshCount = 0
    const mount = () => createApp({
      render: () => h(FilterBar, {
        filters, facets: state.facets, total: 206, loading: state.loading, refreshedAt: 1_790_000_000,
        onRefresh: () => { refreshCount++ },
        onUpdate: next => { updates.push({ ...next }); Object.assign(filters, next) },
        onReset: () => { resetCount++; Object.assign(filters, defaults) },
      }),
    })
    let app = mount()
    app.mount(fixture)
    const results = []
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
    const tick = async () => { await nextTick(); await new Promise(requestAnimationFrame) }
    function check(condition, message) { if (!condition) throw new Error(message) }
    function pass(message) { results.push('PASS ' + message) }
    function input(value) {
      const el = fixture.querySelector('input')
      el.value = value
      el.dispatchEvent(new Event('input', { bubbles: true }))
      return el
    }
    function groupButton(key, label) {
      return [...fixture.querySelector(`[data-filter="${key}"]`).querySelectorAll('.facet-chip')].find(el => el.textContent.trim() === label || el.title === label)
    }

    try {
      await tick()
      check(fixture.querySelectorAll('.facet-skeleton').length === 16, '首次加载时城市和运营商应有占位标签')
      check([...fixture.querySelectorAll('[data-filter="city"] button, [data-filter="operator"] button')].every(button => button.textContent === '全部'), '首次无数据时伪造了动态选项')
      pass('无缓存首屏显示两组占位标签，不再空白、不伪造选项')
      sessionStorage.setItem(FILTER_OPTION_CACHE_KEY, '{invalid')
      check(readFilterOptions().city.length === 0, '损坏缓存未安全降级')
      sessionStorage.removeItem(FILTER_OPTION_CACHE_KEY)
      state.facets = facets
      state.loading = false
      await tick()
      check(fixture.querySelectorAll('.facet-skeleton').length === 0, '数据返回后骨架未消失')
      const optionOrder = ['city', 'operator'].map(key => [...fixture.querySelectorAll(`[data-filter="${key}"] .facet-chip`)].map(el => el.title))
      const loadedHeight = fixture.querySelector('.filter-rows').clientHeight
      state.loading = true
      state.facets = null
      await tick()
      check(groupButton('city', '郑州市').textContent.includes('(—)'), '刷新时未保留已知城市名称')
      check(groupButton('operator', '测试运营商').textContent.includes('(—)'), '刷新时未保留已知运营商名称')
      check(fixture.querySelector('.filter-rows').clientHeight === loadedHeight, '刷新时筛选区域高度发生跳动')
      app.unmount()
      app = mount()
      app.mount(fixture)
      await tick()
      check(groupButton('city', '郑州市') && groupButton('operator', '测试运营商'), '页面重新挂载未恢复选项名称')
      check(!sessionStorage.getItem(FILTER_OPTION_CACHE_KEY).includes('counts'), '不应该缓存筛选计数')
      pass('刷新和重新挂载均保留选项名称、顺序与高度，计数等待新响应')
      state.loading = false
      state.facets = Object.fromEntries(Object.keys(facets).map(key => [key, {total: 0, counts: {}}]))
      await tick()
      check(groupButton('city', '郑州市').textContent.includes('(0)'), '零结果搜索丢失了城市选项')
      check(groupButton('operator', '测试运营商').textContent.includes('(0)'), '零结果搜索丢失了运营商选项')
      state.facets = null
      await tick()
      check(groupButton('city', '郑州市').textContent.includes('(—)'), '失败时把缺失计数误显示为零')
      pass('零结果和接口失败均不丢失选项，未知计数不伪装成零')
      state.facets = facets
      await tick()
      check(JSON.stringify(optionOrder) === JSON.stringify(['city', 'operator'].map(key => [...fixture.querySelectorAll(`[data-filter="${key}"] .facet-chip`)].map(el => el.title))), '刷新后选项顺序跳动')
      check(!fixture.textContent.includes('应用筛选') && !fixture.querySelector('.apply-button'), '仍有应用筛选按钮')
      check(fixture.textContent.includes('筛选后自动更新'), '缺少即时筛选提示')
      check(updates.length === 0, '挂载时不应重复发起请求')
      pass('移除应用按钮，初次挂载不重复请求')
      check(fixture.querySelectorAll('.facet-row').length === 5 && !fixture.querySelector('[data-filter="piles"]'), '电桩筛选仍在')
      check([...fixture.querySelectorAll('.facet-options')].every(row => row.querySelector('.facet-chip').textContent === '全部'), '全部仍带数量')
      check(groupButton('city', '郑州市').textContent.includes('(206)'), '具体选项缺少括号计数')
      check(groupButton('priceBand', '无电价').textContent.includes('(0)'), '零数量未显示')
      check(groupButton('operator', '未知运营商').textContent.includes('(5)'), '缺失运营商未归类')
      pass('仅保留五组筛选；全部无数量，具体选项保留真实括号数量')
      state.loading = true
      await tick()
      check(groupButton('city', '郑州市').textContent.includes('(—)'), '加载时展示旧计数')
      check(groupButton('city', '全部').textContent === '全部', '加载时全部出现括号')
      check(fixture.querySelector('.filter-refresh').disabled, '加载期间仍可重复刷新')
      state.loading = false
      await tick()
      fixture.querySelector('.filter-refresh').click()
      check(refreshCount === 1 && updates.length === 0, '刷新未触发独立事件')
      pass('刷新入口可用，加载时防重复刷新且数量为占位符')
      fixture.querySelector('[data-filter="city"] .facet-expand').click()
      await tick()
      check(groupButton('city', '测试城市8'), '城市展开后缺少选项')
      groupButton('city', '测试城市8').click()
      await tick()
      fixture.querySelector('[data-filter="city"] .facet-expand').click()
      await tick()
      check(groupButton('city', '测试城市8').classList.contains('active'), '收起后选中项不可见')
      pass('城市可展开收起，末尾选项选中后保持可见')
      for (const [key, options] of [
        ['city', [['洛阳市','洛阳市'], ['全部','']]],
        ['operator', [['测试运营商','测试运营商'], ['未知运营商','__unknown__'], ['全部','']]],
        ['availability', [['空闲','idle'], ['适中','moderate'], ['满载','full'], ['无数据','unknown'], ['全部','']]],
        ['priceBand', [['低价','cheap'], ['中位价','mid'], ['高价','expensive'], ['无电价','missing'], ['全部','']]],
        ['tou', [['多时段电价','has'], ['全天统一价','flat'], ['无分时数据','none'], ['全部','']]],
      ]) {
        for (const [label, value] of options) {
          const before = updates.length
          groupButton(key, label).click()
          await tick()
          check(updates.length === before + 1 && updates.at(-1)[key] === value && updates.at(-1).page === 1, key + '/' + label + '未立即更新')
          check(groupButton(key, label).classList.contains('active'), key + '/' + label + '未选中')
        }
        pass(key + ' 每个选项点击即更新并重置页码')
      }
      const sort = fixture.querySelector('select')
      sort.value = 'priceAsc'
      sort.dispatchEvent(new Event('change', { bubbles: true }))
      await tick()
      check(updates.at(-1).sort === 'priceAsc', '排序未立即应用')
      pass('排序立即更新')
      let before = updates.length
      filters.city = '郑州市'
      filters.page = 2
      await tick()
      check(updates.length === before && groupButton('city', '郑州市').classList.contains('active'), '外部同步造成循环请求')
      pass('外部筛选同步不产生循环请求')

      before = updates.length
      input('郑'); await wait(50)
      input('郑州'); await wait(50)
      input('郑州充电站')
      check(updates.length === before, '搜索没有防抖')
      await wait(360); await tick()
      check(updates.length === before + 1 && updates.at(-1).keyword === '郑州充电站' && updates.at(-1).page === 1, '快速输入未合并为最后一次搜索')
      pass('连续输入合并为一次搜索，使用最新关键词')

      before = updates.length
      const search = input('立即搜索')
      search.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', bubbles: true }))
      await tick()
      check(updates.length === before + 1 && updates.at(-1).keyword === '立即搜索', '回车未立即搜索')
      await wait(360)
      check(updates.length === before + 1, '回车后触发了重复搜索')
      pass('回车立即搜索并取消延迟请求')

      before = updates.length
      search.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }))
      input('zhongwen')
      search.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', isComposing: true, bubbles: true }))
      await wait(360)
      check(updates.length === before, '中文输入法组词时触发了搜索')
      search.value = '中文充电站'
      search.dispatchEvent(new CompositionEvent('compositionend', { bubbles: true }))
      await wait(360); await tick()
      check(updates.length === before + 1 && updates.at(-1).keyword === '中文充电站', '中文确认后未搜索最终文字')
      pass('中文组词期间不搜索，确认后只搜索完整文字')

      before = updates.length
      input('筛选联动')
      groupButton('priceBand', '低价').click()
      await tick()
      check(updates.length === before + 1 && updates.at(-1).keyword === '筛选联动' && updates.at(-1).priceBand === 'cheap', '点击筛选丢失了待搜索关键词')
      await wait(360)
      check(updates.length === before + 1, '组合筛选触发重复请求')
      pass('输入后立即点选筛选，合并成一次请求')

      filters.availability = 'idle'
      await tick()
      before = updates.length
      groupButton('availability', '全部').click()
      await tick()
      check(updates.length === before + 1 && updates.at(-1).availability === '', '清除状态未立即更新')
      pass('清除状态筛选立即更新')
      filters.piles = 'with'
      await tick()
      groupButton('city', '全部').click()
      await tick()
      check(updates.at(-1).piles === '', '已移除的电桩筛选条件仍隐式生效')
      pass('已移除的电桩条件不会隐藏生效')

      before = updates.length
      input('重置前的搜索')
      fixture.querySelector('[title="重置筛选"]').click()
      await wait(360); await tick()
      check(resetCount === 1 && updates.length === before && fixture.querySelector('input').value === '', '重置后旧搜索再次生效')
      pass('重置清除待执行搜索，旧条件不会恢复')

      before = updates.length
      input('卸载前的搜索')
      app.unmount()
      await wait(360)
      check(updates.length === before, '卸载后仍触发搜索')
      pass('卸载时清理搜索定时器')
      output.textContent = `全部 ${results.length} 项测试通过\n${results.join('\n')}`
      output.dataset.result = 'passed'
    } catch (error) {
      output.textContent = `${results.join('\n')}\nFAIL ${error.message}`
      output.dataset.result = 'failed'
      console.error(error)
    } finally {
      if (originalCache === null) sessionStorage.removeItem(FILTER_OPTION_CACHE_KEY)
      else sessionStorage.setItem(FILTER_OPTION_CACHE_KEY, originalCache)
    }
  </script>
</body>
</html>
